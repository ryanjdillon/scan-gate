name: Docker

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          file: deploy/Dockerfile
          platforms: linux/amd64
          tags: |
            ghcr.io/ryanjdillon/scan-gate:latest
            ghcr.io/ryanjdillon/scan-gate:v${{ steps.version.outputs.version }}
            ghcr.io/ryanjdillon/scan-gate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The secretscan sidecar: a separate distroless image, built from source.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: sidecar/secretscan
          push: true
          file: deploy/secretscan.Dockerfile
          platforms: linux/amd64
          tags: |
            ghcr.io/ryanjdillon/scan-gate-secretscan:latest
            ghcr.io/ryanjdillon/scan-gate-secretscan:v${{ steps.version.outputs.version }}
            ghcr.io/ryanjdillon/scan-gate-secretscan:${{ github.sha }}
          cache-from: type=gha,scope=secretscan
          cache-to: type=gha,mode=max,scope=secretscan
