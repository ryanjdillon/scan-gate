name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        # Pin to the same ruff as pyproject's dev extra so `just check` locally
        # matches CI exactly.
        with:
          version: "0.16.4"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # The same pins the image installs, so CI tests what ships. corpus-detect
      # comes from its git reference in pyproject.toml.
      - name: Install
        run: pip install -c deploy/constraints.txt -e '.[test]'

      - name: Tests with coverage
        run: coverage run -m pytest
        # A native crash prints its C-level Python stack instead of a bare exit 139.
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Coverage report
        run: coverage report --precision=2

      - name: Coverage ratchet
        run: |
          current=$(coverage report --format=total --precision=2)
          python scripts/coverage_gate.py "$current" .github/coverage-baseline.txt

  secretscan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/secretscan
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecar/secretscan/go.mod
          cache-dependency-path: sidecar/secretscan/go.sum

      - name: Verify modules against go.sum
        run: go mod verify

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      # The race detector needs cgo; the shipped binary is still built without it.
      - name: Tests with the race detector
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  # The sidecar image builds on every PR (not pushed), so a broken pin or
  # build fails before a release tag does.
  secretscan-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: sidecar/secretscan
          file: deploy/secretscan.Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=secretscan
          cache-to: type=gha,mode=max,scope=secretscan
