name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        # Pin to the same ruff as pyproject's dev extra so `just check` locally
        # matches CI exactly.
        with:
          version: "0.16.4"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # The same pins the image installs, so CI tests what ships. corpus-detect
      # comes from its git reference in pyproject.toml.
      - name: Install
        run: pip install -c deploy/constraints.txt -e '.[test]'

      - name: Tests with coverage
        run: coverage run -m pytest
        # A native crash prints its C-level Python stack instead of a bare exit 139.
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Coverage report
        run: coverage report --precision=2

      - name: Coverage ratchet
        run: |
          current=$(coverage report --format=total --precision=2)
          python scripts/coverage_gate.py "$current" .github/coverage-baseline.txt
